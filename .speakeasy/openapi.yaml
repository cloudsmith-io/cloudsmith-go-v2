        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        description: The `slug_perm` of the package.
        required: true
      - in: path
        name: slug_perm
        schema:
          type: string
        description: The `slug_perm` of the metadata entry.
        required: true
      tags:
      - metadata
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMetadataRead'
          description: The requested metadata entry.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller is authenticated but lacks permission to perform
            this action, or the requested operation is not allowed for the target
            resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: The package or metadata entry could not be found.
    patch:
      operationId: metadata_packages_partial_update
      description: Edit a specific metadata entry for a package.
      summary: Update a package metadata entry
      parameters:
      - in: path
