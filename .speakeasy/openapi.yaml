        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: The package or metadata entry could not be found.
  /metadata/validate/:
    post:
      operationId: metadata_validate_create
      description: Validate a metadata payload against the JSON schema for its ``content_type``
        without persisting it. Returns 200 on success and 422 on validation failure,
        with the same field-level error shape as the create endpoint.
      summary: Validate a metadata payload
      tags:
      - metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactMetadataValidate'
        required: true
      responses:
        '200':
          description: The payload is valid for the given content type.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                ContentNotAJSONObject:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content must be a JSON object.
                  summary: Content not a JSON object
                ContentDoesNotMatchSchema:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content does not conform to the schema for content type 'application/vnd.cloudsmith.metadata.example+json'.
                  summary: Content does not match schema
                ContentTypeChangedAfterCreation:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content_type:
                      - content_type cannot be changed after creation.
                  summary: content_type changed after creation
          description: The request body failed validation.
  /packages/{package_slug_perm}/vulnerabilities/:
    get:
      operationId: packages_vulnerabilities_list
      description: OSV advisory data for a specific package.
      parameters:
      - in: query
        name: cvss_max
        schema:
          type: number
          format: double
          maximum: 10.0
          minimum: 0.0
        description: Maximum CVSS score (inclusive). Filters vulnerabilities whose
          best classified severity has a numerical score <= this value. Use with cvss_min
          for range filtering.
      - in: query
        name: cvss_min
        schema:
          type: number
          format: double
          maximum: 10.0
          minimum: 0.0
        description: Minimum CVSS score (inclusive). Filters vulnerabilities whose
          best classified severity has a numerical score >= this value. Use with cvss_max
          for range filtering.
      - in: query
        name: is_malware
        schema:
          type: boolean
          nullable: true
        description: Filter by malware classification (MAL- prefix or CWE-506). When
          true, only malware entries are returned; when false, malware entries are
          excluded.
      - in: path
        name: package_slug_perm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: primary_records
        schema:
          type: boolean
          default: true
        description: When true (default), only primary vulnerability records are returned,
          excluding records that describe the same flaw. When false, all matched records
          are returned including duplicates.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - -epss
          - -severity
          - epss
          - severity
          default: -severity
        description: Field to sort by. Prepend `-` for descending order. `severity`
          sorts by threat level, then CVSS score; within each threat level, vulnerabilities
          without a CVSS score come last when descending and first when ascending.
          `epss` sorts by the EPSS score of the vulnerability's CVE (`cve_id`); vulnerabilities
          without an EPSS score always come last, and equal scores are ordered most
          severe first in either direction.
      - in: query
        name: threat_level
        schema:
          enum:
          - critical
          - high
          - important
          - low
          - malware
          - medium
          - moderate
          - negligible
          - none
          - unimportant
          - unknown
          type: string
          minLength: 1
        description: |-
          Filter by threat level. Matches the single best classified severity. Accepts normalized threat levels (critical, high, medium, low, unknown, malware) and vendor aliases (important, moderate, negligible, none, unimportant).

          * `critical` - critical
          * `high` - high
          * `important` - important
          * `low` - low
          * `malware` - malware
          * `medium` - medium
          * `moderate` - moderate
          * `negligible` - negligible
          * `none` - none
          * `unimportant` - unimportant
          * `unknown` - unknown
      - in: query
        name: vulnerability_id
        schema:
          type: string
          minLength: 1
        description: Filter by OSV vulnerability identifier (e.g., CVE-2024-1234 or
          GHSA-xxxx). Matching is exact and case-sensitive, and also checks the aliases
          and upstream identifiers of each advisory.
      tags:
      - packages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebOSVVulnerabilityList'
          description: ''
  /packages/{package_slug_perm}/vulnerabilities/counts/:
    get:
      operationId: packages_vulnerabilities_counts_list
      description: OSV advisory counts for a specific package.
      parameters:
      - in: path
        name: package_slug_perm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        required: true
      - in: query
        name: primary_records
        schema:
          type: boolean
          default: true
        description: When true (default), only primary vulnerability records are returned,
          excluding records that describe the same flaw. When false, all matched records
          are returned including duplicates.
      tags:
      - packages
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebOSVSeverityCounts'
          description: ''
  /workspaces/{workspace}/domains/:
    get:
      operationId: workspaces_domains_list
      description: |-
        List active custom and Cloudsmith-owned domains available to a workspace. Cloudsmith-owned domains are the shared hostnames every workspace can use; custom domains are listed when enabled and validated, regardless of subscription status. Workspace membership is required, including for service accounts. Discovering a domain does not grant repository access.

        For client setup, pass both `repository` and `domain_type`, then take the first result as the preferred domain for that repository and purpose. Without `repository`, the response is a workspace-wide inventory: a `REPOSITORY` domain must only be used for the repository named in that entry. The endpoint returns results in preference order: `REPOSITORY` domains come first, then `WORKSPACE` domains, then `GLOBAL` domains. Within each custom domain scope, primary domains come before the rest, then the oldest domain comes first.

        Responses contain a `results` array. Follow the `Link` header's `next` relation until absent to discover all domains; an empty array means no domains match the filters. A hostname can appear under multiple domain types. Native types are only listed for package formats enabled for the request. Clients should tolerate new domain types.

        This endpoint discovers hostnames, not complete package-manager URLs. URL paths and authentication depend on the format and domain scope; custom domains are not necessarily a hostname-only replacement in an existing URL.
      parameters:
      - in: query
        name: domain_name
        schema:
          type: string
          minLength: 1
        description: Filter to the domain with this name. The match ignores case.
      - in: query
        name: domain_scope
        schema:
          enum:
          - GLOBAL
          - WORKSPACE
          - REPOSITORY
          type: string
          minLength: 1
        description: |-
          Filter by the scope of the domain.

          * `GLOBAL` - Global
          * `WORKSPACE` - Workspace
          * `REPOSITORY` - Repository
      - in: query
        name: domain_type
        schema:
          enum:
          - DOWNLOAD
          - UPLOAD
          - CLOUDSMITH_API
          - NATIVE_SKILLS
          - NATIVE_CARGO
          - NATIVE_COMPOSER
          - NATIVE_CONAN
          - NATIVE_CONDA
          - NATIVE_DART
          - NATIVE_DOCKER
          - NATIVE_GENERIC
          - NATIVE_GO
          - NATIVE_HELM_OCI
          - NATIVE_HEX
          - NATIVE_HUGGINGFACE
          - NATIVE_MAVEN
          - NATIVE_NIX
          - NATIVE_NPM
          - NATIVE_NUGET
          - NATIVE_PYTHON
          - NATIVE_RUBY
          - NATIVE_SWIFT
          - NATIVE_TERRAFORM
          - NATIVE_VSX
          type: string
          minLength: 1
        description: |-
          Filter by the purpose the domain serves.

          * `DOWNLOAD` - Downloads
          * `UPLOAD` - Uploads
          * `CLOUDSMITH_API` - Cloudsmith API
          * `NATIVE_SKILLS` - Native API: AI Skills
          * `NATIVE_CARGO` - Native API: Cargo
          * `NATIVE_COMPOSER` - Native API: Composer
          * `NATIVE_CONAN` - Native API: Conan
          * `NATIVE_CONDA` - Native API: Conda
          * `NATIVE_DART` - Native API: Dart
          * `NATIVE_DOCKER` - Native API: Docker
          * `NATIVE_GENERIC` - Native API: Generic
          * `NATIVE_GO` - Native API: Go
          * `NATIVE_HELM_OCI` - Native API: Helm (OCI)
          * `NATIVE_HEX` - Native API: Hex
          * `NATIVE_HUGGINGFACE` - Native API: HuggingFace
          * `NATIVE_MAVEN` - Native API: Maven
          * `NATIVE_NIX` - Native API: Nix
          * `NATIVE_NPM` - Native API: npm
          * `NATIVE_NUGET` - Native API: NuGet
          * `NATIVE_PYTHON` - Native API: Python
          * `NATIVE_RUBY` - Native API: Ruby
          * `NATIVE_SWIFT` - Native API: Swift
          * `NATIVE_TERRAFORM` - Native API: Terraform
          * `NATIVE_VSX` - Native API: VSX
      - in: query
        name: fields
        schema:
          type: string
        description: Comma-separated fields to include in the response (e.g. `domain_name,domain_type`).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: repository
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: Filter to domains that serve this repository, plus the domains
          that serve the whole workspace. Omit to list domains for all repositories.
      - in: path
        name: workspace
        schema:
          type: string
        description: The `name` of the Workspace.
        required: true
      tags:
      - workspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDomainList'
              examples:
                PreferredRepositoryDomain:
                  value:
                    results:
                    - domain_name: python.example.com
                      domain_type: NATIVE_PYTHON
                      repository: my-repository
                      domain_scope: REPOSITORY
                  summary: Preferred repository domain
          description: Domains in preference order, with pagination in the headers.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                RepositoryDoesNotExist:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      repository:
                      - Repository "my-repository" does not exist in this workspace.
                  summary: repository does not exist
          description: Invalid query parameters.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
