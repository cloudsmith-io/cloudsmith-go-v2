      type: object
      description: A single finding emitted by the validate endpoint.
      properties:
        severity:
          type: string
          description: Finding severity. Currently always 'error'.
        code:
          type: string
          description: Machine-readable finding code (e.g. 'rego_type_error', 'policy_compile_error').
        message:
          type: string
          description: Human-readable finding message.
        line:
          type: integer
          nullable: true
          description: 1-indexed line number in the source, if known.
      required:
      - code
      - line
      - message
      - severity
    PolicyValidateRequest:
      type: object
      description: Request body for POST .../policies/validate/.
      properties:
        rego:
          type: string
          description: The Rego policy source to validate. Maximum 256 KB. Not persisted.
          maxLength: 262144
      required:
      - rego
    PolicyValidateResponse:
      type: object
      description: Response body for POST .../policies/validate/.
      properties:
        is_valid:
          type: boolean
          description: True when no finding has severity 'error'.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyValidateFinding'
        raw:
          type: string
          description: Full raw OPA output; empty when the policy is valid.
      required:
      - findings
      - is_valid
      - raw
