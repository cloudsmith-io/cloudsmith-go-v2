openapi: 3.0.3
info:
  title: Cloudsmith API
  version: 1.1491.0 (v2)
  description: The API to the Cloudsmith Service
  termsOfService: https://help.cloudsmith.io/docs/legal-policies-overview
  contact:
    email: support@cloudsmith.io
    name: Cloudsmith Support
    url: https://help.cloudsmith.io/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /analytics/logs/package/{workspace}/:
    get:
      operationId: analytics_logs_package_list
      description: Returns package log events, including uploads, copies, deletes,
        etc.
      parameters:
      - in: query
        name: end_time
        schema:
          type: string
          format: date-time
        description: End of the time range to filter logs. End time is exclusive,
          i.e. an end time of `2025-01-01` results in a query that returns logs with
          a timestamp of _before_ `2025-01-01T00:00:00`.
      - in: query
        name: event_action
        schema:
          type: array
          items:
            enum:
            - SYNC
            - DELETE
            - COPY
            - MOVE
            - RESYNC
            - REPUBLISH
            - UNPUBLISH
            - TAGS_CHANGED
            - QUARANTINE
            - RESTORE
            - POLICY_VIOLATION
            - HARD_DELETE
            - HIDDEN
            type: string
            description: |-
              * `SYNC` - sync
              * `DELETE` - delete
              * `COPY` - copy
              * `MOVE` - move
              * `RESYNC` - resync
              * `REPUBLISH` - republish
              * `UNPUBLISH` - unpublish
              * `TAGS_CHANGED` - tags changed
              * `QUARANTINE` - quarantined
              * `RESTORE` - restored
              * `POLICY_VIOLATION` - policy violation
              * `HARD_DELETE` - hard delete
              * `HIDDEN` - hidden
        description: Type of sync action by which to filter logs (e.g. SYNC, DELETE,
          COPY). Multiple actions can be provided e.g. `event_action=SYNC&event_action=DELETE`.
      - in: query
        name: event_actor
        schema:
          type: array
          items:
            type: string
        description: Actor slug or unique identifier (slug-perm) by which to filter
          logs. Multiple actors can be provided e.g. `event_actor=my-user&event_actor=W9iD9l2rNnrk`.
      - in: query
        name: event_actor_type
        schema:
          type: array
          items:
            enum:
            - USER
            - SERVICE
            type: string
            description: |-
              * `USER` - User
              * `SERVICE` - Service
        description: Type of actor by which to filter logs (e.g. USER, SERVICE). Multiple
          types can be provided e.g. `event_actor_type=USER&event_actor_type=SERVICE`.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Response format. Use `json` (default) for a paginated JSON response,
          or `csv` to download the results as CSV.
      - in: query
        name: package
        schema:
          type: array
          items:
            type: string
        description: Package name or unique identifier (slug-perm) by which to filter
          logs. Multiple values can be provided e.g. `package=my-package&package=W9iD9l2rNnrk`.
      - in: query
        name: package_format
        schema:
          type: array
          items:
            enum:
            - DEB
            - RPM
            - RUBY
            - PYTHON
            - MAVEN
            - BOWER
            - DOCKER
            - RAW
            - CHOCOLATEY
            - NPM
            - NUGET
            - VAGRANT
            - COMPOSER
            - ALPINE
            - HELM
            - CONAN
            - CARGO
            - LUAROCKS
            - CRAN
            - GO
            - DART
            - COCOAPODS
            - TERRAFORM
            - P2
            - CONDA
            - HEX
            - SWIFT
            - HUGGINGFACE
            - GENERIC
            - VSX
            - MCP
            - NIX
            - SKILLS
            type: string
            description: |-
              * `DEB` - Debian
              * `RPM` - RedHat
              * `RUBY` - Ruby
              * `PYTHON` - Python
              * `MAVEN` - Maven
              * `BOWER` - Bower
              * `DOCKER` - Docker
              * `RAW` - Raw
              * `CHOCOLATEY` - Chocolatey
              * `NPM` - npm
              * `NUGET` - NuGet
              * `VAGRANT` - Vagrant
              * `COMPOSER` - Composer
              * `ALPINE` - Alpine
              * `HELM` - Helm
              * `CONAN` - Conan
              * `CARGO` - Cargo
              * `LUAROCKS` - LuaRocks
              * `CRAN` - CRAN
              * `GO` - Go
              * `DART` - Dart
              * `COCOAPODS` - CocoaPods
              * `TERRAFORM` - Terraform
              * `P2` - P2
              * `CONDA` - Conda
              * `HEX` - Hex
              * `SWIFT` - Swift
              * `HUGGINGFACE` - HuggingFace
              * `GENERIC` - Generic
              * `VSX` - VSX
              * `MCP` - MCP
              * `NIX` - Nix
              * `SKILLS` - AI Skills
        description: Type of package formats by which to filter logs (e.g. Nuget,
          Cargo, Raw). Multiple formats can be provided e.g. `package_format=Nuget&package_format=Cargo`.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: query
        schema:
          type: string
        description: A search string for filtering logs. Legal prefixes are `package`
          (alias `name`), `package_format` (alias `format`), `event_action`, `event_actor`,
          `event_actor_type`, `repository` and `version`; a term with no prefix matches
          the package name or identifier. Boolean operators may be used to construct
          intricate queries. Omitting boolean operators is interpreted as an implicit
          `AND`. The expression is combined (AND) with any other filter parameters.
        examples:
          PackageNamedSemverOrAnyRuby-formatPackage:
            value: package:semver OR package_format:ruby
            summary: Package named semver or any Ruby-format package
      - in: query
        name: repository
        schema:
          type: array
          items:
            type: string
        description: List of repositories for filtering logs. Multiple repositories
          can be provided e.g. `repository=test-repo&repository=another-repo`.
      - in: query
        name: start_time
        schema:
          type: string
          format: date-time
        description: Start of the time range to filter logs. Start time is inclusive,
          i.e. a start time of `2025-01-01` results in a query that returns logs with
          a timestamp starting from `2025-01-01T00:00:00`.
      - in: path
        name: workspace
        schema:
          type: string
        description: The `name` of the Workspace.
        required: true
      tags:
      - analytics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackageLogsResponseList'
            text/csv:
              schema:
                type: string
          description: ''
  /metadata/packages/{package_slug_perm}/:
    get:
      operationId: metadata_packages_list
      description: List all metadata entries for a package.
      summary: List metadata for a package
      parameters:
      - in: query
        name: classification
        schema:
          enum:
          - UNKNOWN
          - INTRINSIC
          - SECURITY
          - PROVENANCE
          - SBOM
          - GENERIC
          type: string
          minLength: 1
        description: |-
          Filter results by metadata classification.

          * `UNKNOWN` - Unknown
          * `INTRINSIC` - Intrinsic
          * `SECURITY` - Security
          * `PROVENANCE` - Provenance
          * `SBOM` - SBOM
          * `GENERIC` - Generic
      - in: path
        name: package_slug_perm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        description: The `slug_perm` of the package.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source_kind
        schema:
          enum:
          - UNKNOWN
          - SYSTEM
          - UPSTREAM
          - CUSTOM
          - THIRD_PARTY
          type: string
          minLength: 1
        description: |-
          Filter results by metadata source kind.

          * `UNKNOWN` - Unknown
          * `SYSTEM` - System
          * `UPSTREAM` - Upstream
          * `CUSTOM` - Custom
          * `THIRD_PARTY` - Third Party
      tags:
      - metadata
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactMetadataReadList'
          description: A paginated collection of metadata entries for the package.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller is authenticated but lacks permission to perform
            this action, or the requested operation is not allowed for the target
            resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: The package or metadata entry could not be found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                InvalidClassification:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      classification:
                      - '"bogus" is not a valid choice.'
                  summary: Invalid classification
          description: One or more query parameters failed validation.
    post:
      operationId: metadata_packages_create
      description: Attach arbitrary metadata to a package.
      summary: Attach metadata to a package
      parameters:
      - in: path
        name: package_slug_perm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        description: The `slug_perm` of the package.
        required: true
      tags:
      - metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactMetadataWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMetadataEntry'
          description: The metadata entry was created successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                PaymentRequired:
                  value:
                    detail: To use this endpoint, an upgrade to the Ultra plan is
                      required.
                  summary: Payment Required
          description: The target workspace's plan does not include the metadata feature.
            Upgrade to a plan that includes ``package_metadata`` to use this endpoint.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller is authenticated but lacks permission to perform
            this action, or the requested operation is not allowed for the target
            resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: The package or metadata entry could not be found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                ContentNotAJSONObject:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content must be a JSON object.
                  summary: Content not a JSON object
                ContentDoesNotMatchSchema:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content does not conform to the schema for content type 'application/vnd.cloudsmith.metadata.example+json'.
                  summary: Content does not match schema
                ContentTypeChangedAfterCreation:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content_type:
                      - content_type cannot be changed after creation.
                  summary: content_type changed after creation
          description: The request body failed validation.
  /metadata/packages/{package_slug_perm}/{slug_perm}/:
    get:
      operationId: metadata_packages_retrieve
