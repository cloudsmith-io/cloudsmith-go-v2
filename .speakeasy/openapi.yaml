      discriminator:
        propertyName: type
        mapping:
          Unknown: '#/components/schemas/PolicyHuggingfaceUnknownCardTyped'
          Model: '#/components/schemas/PolicyHuggingfaceModelCardTyped'
          Dataset: '#/components/schemas/PolicyHuggingfaceDatasetCardTyped'
    PolicyHuggingfaceDatasetCard:
      type: object
      description: |-
        The dataset-card of a Huggingface package.

        The dataset-card is metadata specified inside the README.md file of a Huggingface model.
      properties:
        annotations_creators:
          type: array
          items:
            type: string
          nullable: true
          description: 'How the annotations for the dataset were created. Options
            are: ''found'', ''crowdsourced'', ''expert-generated'', ''machine-generated'',
            ''no-annotation'', ''other''.'
        config_names:
          type: array
          items:
            type: string
          nullable: true
          description: ' A list of the available dataset configs for the dataset.'
        extras:
          type: object
          additionalProperties: {}
          nullable: true
          description: Any additional metadata fields present in the datasetcard that
            is not one of the well-known fields.
        language:
          type: array
          items:
            type: string
          nullable: true
          description: List of languages of the dataset's data or metadata.
        language_creators:
          type: array
          items:
            type: string
          nullable: true
          description: 'How the text-based data in the dataset was created. Options
            are: ''found'', ''crowdsourced'', ''expert-generated'', ''machine-generated'',
            ''other''.'
        license:
          type: array
          items:
            type: string
          nullable: true
          description: The license(s) identifier(s) of this dataset, e.g. apache-2.0.
        multilinguality:
          type: array
          items:
            type: string
          nullable: true
          description: 'Whether the dataset is multilingual. Options are: ''monolingual'',
            ''multilingual'', ''translation'', ''other''.'
        paperswithcode_id:
          type: string
          nullable: true
          description: The ID of the dataset on PapersWithCode.
        pretty_name:
          type: string
          nullable: true
          description: A human-readable name for the dataset, e.g. 'Cities and Buildings'.
        size_categories:
          type: array
          items:
            type: string
          nullable: true
          description: 'The number of examples in the dataset. Options are: ''n<1K'',
            ''1K<n<10K'', ''10K<n<100K'', ''100K<n<1M'', ''1M<n<10M'', ''10M<n<100M'',
            ''100M<n<1B'', ''1B<n<10B'', ''10B<n<100B'', ''100B<n<1T'', ''n>1T'',
            and ''other''.'
        source_datasets:
          type: array
          items:
            type: string
          nullable: true
          description: 'Indicates whether the dataset is an original dataset or extended
            from another existing dataset. Options are: ''original'' and ''extended''.'
        task_categories:
          type: array
          items:
            type: string
          nullable: true
          description: The categories of tasks that the dataset supports.
        task_ids:
          type: array
          items:
            type: string
          nullable: true
          description: The specific tasks that the dataset supports
        train_eval_index:
          nullable: true
          description: JSON that describes the necessary spec for doing evaluation
            on the Hub.
    PolicyHuggingfaceDatasetCardTyped:
      allOf:
      - type: object
        properties:
          type:
            type: string
        required:
        - type
      - $ref: '#/components/schemas/PolicyHuggingfaceDatasetCard'
    PolicyHuggingfaceEvalResult:
      type: object
      description: |-
        The evaluation results of model-card of a Huggingface package.

        A flattened version of the evaluation results from the model card.
      properties:
        task_type:
          type: string
          description: The task identifier, e.g. image-classification.
        dataset_type:
          type: string
          description: The dataset identifier, e.g.g common_voice.
        dataset_name:
          type: string
          description: A pretty name for the dataset, e.g. Common Voice.
        metric_type:
          type: string
          description: The metric identifier, e.g. accuracy.
        metric_value:
          type: string
          description: The value fo the metric, e.g. 0.95.
        task_name:
          type: string
          nullable: true
          description: The pretty name of the task, e.g. Speech Recognition.
        dataset_config:
          type: string
          nullable: true
          description: The name of the dataset configuration used in `load_dataset()`.
        dataset_split:
          type: string
          nullable: true
          description: The split used in the `load_dataset()`.
        dataset_revision:
          type: string
          nullable: true
          description: The revision (aka git sha) of the dataset used in `load_dataset()`.
        dataset_args:
          type: object
          additionalProperties: {}
          nullable: true
          description: The arguments passed during `Metric.compute()`.
        metric_name:
          type: string
          nullable: true
          description: A pretty name for the metric, e.g. Accuracy.
        metric_config:
          type: string
          nullable: true
          description: The name of metric used in `load_metric()`.
        metric_args:
          type: object
          additionalProperties: {}
          nullable: true
          description: The arguments passed during `Metric.compute()`.
        verified:
          type: boolean
          nullable: true
          description: Indicates if the metrics originate from Hugging Face's evaluation
            serivce.
        verify_token:
          type: string
          nullable: true
          description: A JWT token used to verify the metrics origin.
        source_name:
          type: string
          nullable: true
          description: The name of the source of the evaluation result, e.g. Open
            LLM Leaderboard.
        source_url:
          type: string
          nullable: true
          description: The url of the source of the evalatuation result.
