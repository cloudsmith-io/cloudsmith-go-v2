        description: The `slug_perm` of the package.
        required: true
      - in: path
        name: slug_perm
        schema:
          type: string
        description: The `slug_perm` of the metadata entry.
        required: true
      tags:
      - metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtifactMetadataWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMetadataEntry'
          description: The metadata entry was updated successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                PaymentRequired:
                  value:
                    detail: To use this endpoint, an upgrade to the Ultra plan is
                      required.
                  summary: Payment Required
          description: The target workspace's plan does not include the metadata feature.
            Upgrade to a plan that includes ``package_metadata`` to use this endpoint.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller is authenticated but lacks permission to perform
            this action, or the requested operation is not allowed for the target
            resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: The package or metadata entry could not be found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                ContentNotAJSONObject:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content must be a JSON object.
                  summary: Content not a JSON object
                ContentDoesNotMatchSchema:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content:
                      - Content does not conform to the schema for content type 'application/vnd.cloudsmith.metadata.example+json'.
                  summary: Content does not match schema
                ContentTypeChangedAfterCreation:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      content_type:
                      - content_type cannot be changed after creation.
                  summary: content_type changed after creation
          description: The request body failed validation.
    delete:
      operationId: metadata_packages_destroy
      description: Remove a specific metadata entry from a package.
      summary: Delete a package metadata entry
      parameters:
      - in: path
        name: package_slug_perm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
        description: The `slug_perm` of the package.
        required: true
      - in: path
        name: slug_perm
        schema:
          type: string
        description: The `slug_perm` of the metadata entry.
        required: true
      tags:
      - metadata
      responses:
        '204':
          description: The metadata entry was removed successfully.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided or are invalid.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                PaymentRequired:
                  value:
                    detail: To use this endpoint, an upgrade to the Ultra plan is
                      required.
                  summary: Payment Required
          description: The target workspace's plan does not include the metadata feature.
