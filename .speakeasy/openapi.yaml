        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: The caller is authenticated but lacks permission to perform
            this action, or the requested operation is not allowed for the target
