components:
  schemas:
    AddPackageTagsPolicyAction:
      type: object
      properties:
        precedence:
          type: integer
          maximum: 32767
          minimum: 0
          description: The order in which this action occurs relative to other actions
            for the same policy.
        slug_perm:
          type: string
          readOnly: true
          description: The Action identifier.
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the policy was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the policy was updated.
        effect:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
            maxLength: 100
      required:
      - created_at
      - effect
      - slug_perm
      - tags
      - updated_at
    AddPackageTagsPolicyActionTyped:
      allOf:
      - type: object
        properties:
          action_type:
            type: string
        required:
        - action_type
      - $ref: '#/components/schemas/AddPackageTagsPolicyAction'
    ArtifactMetadataEntry:
      type: object
      description: A package metadata entry.
      properties:
        content:
          type: object
          additionalProperties: {}
          description: The metadata payload as a JSON object.
        content_type:
          type: string
          description: The content type describing the structure of the metadata payload.
          maxLength: 128
        source_identity:
          type: string
          description: The identifier for the source of this metadata, for example
            'upstream:npmjs'.
          maxLength: 128
        slug_perm:
          type: string
          readOnly: true
          description: The unique slug identifying this metadata entry.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - content
      - content_type
      - slug_perm
      - source_identity
    ArtifactMetadataRead:
      type: object
      description: Serializer for GET list/retrieve on the effective metadata view.
      properties:
        slug_perm:
          type: string
          readOnly: true
          description: The unique slug identifying this metadata entry.
        content:
          type: object
          additionalProperties: {}
          readOnly: true
          description: The metadata payload as a JSON object.
        content_type:
          type: string
          readOnly: true
          description: The content type describing the structure of the metadata payload.
        classification:
          allOf:
          - $ref: '#/components/schemas/ClassificationEnum'
          description: |-
            The classification assigned to this metadata entry.

            * `UNKNOWN` - Unknown
            * `INTRINSIC` - Intrinsic
            * `SECURITY` - Security
            * `PROVENANCE` - Provenance
            * `SBOM` - SBOM
            * `GENERIC` - Generic
        source_kind:
          allOf:
          - $ref: '#/components/schemas/SourceKindEnum'
          description: |-
            The origin of this metadata entry, such as upstream, custom, or third party.

            * `UNKNOWN` - Unknown
            * `SYSTEM` - System
            * `UPSTREAM` - Upstream
            * `CUSTOM` - Custom
            * `THIRD_PARTY` - Third Party
        source_identity:
          type: string
          readOnly: true
          description: The identifier for the source that supplied this metadata.
        is_canonical:
          type: boolean
          readOnly: true
          description: Whether this entry is the canonical metadata record for its
            type.
        source_table:
          type: string
          readOnly: true
          description: The backing table or source model for this metadata entry.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When this metadata entry was created.
      required:
      - classification
      - content
      - content_type
      - created_at
      - is_canonical
      - slug_perm
      - source_identity
      - source_kind
      - source_table
    ArtifactMetadataValidate:
      type: object
      description: |-
        Serializer for POST /metadata/validate.

        Same shape and validation rules as the write serializer but without
        fields tied to persistence (e.g. ``source_identity``). Used by clients
        that want to fail fast on a metadata payload before they have a
        package slug to attach it to.
      properties:
        content:
          type: object
          additionalProperties: {}
          description: The metadata payload as a JSON object.
        content_type:
          type: string
          description: The content type describing the structure of the metadata payload.
          maxLength: 128
      required:
      - content
      - content_type
    ArtifactMetadataWrite:
      type: object
      description: Fields for creating or updating package metadata.
      properties:
        content:
          type: object
          additionalProperties: {}
          description: The metadata payload as a JSON object.
        content_type:
          type: string
          description: The content type describing the structure of the metadata payload.
          maxLength: 128
        source_identity:
          type: string
          description: The identifier for the source of this metadata, for example
            'upstream:npmjs'.
          maxLength: 128
      required:
      - content
      - content_type
      - source_identity
    AvailabilityEnum:
      enum:
      - UNAVAILABLE
      - PARTIAL
      - COMPLETE
      type: string
      description: |-
        * `UNAVAILABLE` - Unavailable
        * `PARTIAL` - Partially complete
        * `COMPLETE` - Complete
    BlockPackagePolicyAction:
      type: object
      properties:
        precedence:
          type: integer
          maximum: 32767
          minimum: 0
          description: The order in which this action occurs relative to other actions
            for the same policy.
        slug_perm:
          type: string
          readOnly: true
          description: The Action identifier.
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the policy was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the policy was updated.
        effect:
          type: string
          readOnly: true
      required:
      - created_at
      - effect
      - slug_perm
      - updated_at
    BlockPackagePolicyActionTyped:
      allOf:
      - type: object
        properties:
          action_type:
            type: string
        required:
        - action_type
      - $ref: '#/components/schemas/BlockPackagePolicyAction'
    ClassificationEnum:
