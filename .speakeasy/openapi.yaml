  /workspaces/{workspace}/policies/{policy}/simulate/:
    get:
      operationId: workspaces_policies_simulate_list
      description: |-
        Simulates the execution of a Policy to verify its behavior without taking any actions.

        Before using this endpoint, the Policy to simulate must be created with the creation endpoint. To experiment
        with the policy, it is recommended to create the policy with disabled=True, so that it does not take effect
        outside the simulation endpoint.

        This endpoint evaluates all packages in the workspace, generating a "decision log" for each evaluation.
        Each log contains:
        - Package metadata provided to the policy engine at runtime.
        - Output from the user-defined Rego policy.

        No actions associated with the policy are executed. Instead, the endpoint reports what would happen to each package if the policy were active.
      parameters:
      - in: query
        name: package_query_string
        schema:
          type: string
        description: A [package search](https://help.cloudsmith.io/docs/search-packages)
          query by which to filter the packages being evaluated.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: policy
        schema:
          type: string
        description: The `slug_perm` (identifier) of the Policy.
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        description: The `name` of the Workspace.
        required: true
      tags:
      - workspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyDecisionLogList'
          description: ''
  /workspaces/{workspace}/policies/decision-logs-v1/:
    get:
      operationId: workspaces_policies_decision_logs_v1_list
      description: List policy evaluation decision logs.
      parameters:
      - in: query
        name: after_id
        schema:
          type: string
          pattern: ^[0-9A-Z]{26}$
          maxLength: 26
          minLength: 26
        description: 'Return only logs newer than this `id`. This operates as an exclusive
          lower bound, so passing the newest `id` from a previous response fetches
          everything added since without repeating it. Prefer this over `created_after`
          for incremental fetches: `created_after` resolves only to the millisecond,
          and logs from a single evaluation commonly share one.'
      - in: query
        name: correlation_id
        schema:
          type: string
          format: uuid
        description: Filter by `correlation_id`.
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Filter by the datetime at which the log was created. This operates
          as an inclusive lower bound (greater than or equal to).
        required: true
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: Filter by the datetime at which the log was created. This operates
          as an exclusive upper bound (less than).
      - in: query
        name: match
        schema:
          type: boolean
          nullable: true
        description: Filter by whether the policy matched the package.
      - in: query
        name: package_format
        schema:
          type: array
          items:
            enum:
            - DEB
            - RPM
            - RUBY
            - PYTHON
            - MAVEN
            - BOWER
            - DOCKER
            - RAW
            - CHOCOLATEY
            - NPM
            - NUGET
            - VAGRANT
            - COMPOSER
            - ALPINE
            - HELM
            - CONAN
            - CARGO
            - LUAROCKS
            - CRAN
            - GO
            - DART
            - COCOAPODS
            - TERRAFORM
            - P2
            - CONDA
            - HEX
            - SWIFT
            - HUGGINGFACE
            - GENERIC
            - VSX
            - MCP
            - NIX
            - SKILLS
            - DEFAULT
            type: string
            description: |-
              * `DEB` - Debian
              * `RPM` - RedHat
              * `RUBY` - Ruby
              * `PYTHON` - Python
              * `MAVEN` - Maven
              * `BOWER` - Bower
              * `DOCKER` - Docker
              * `RAW` - Raw
              * `CHOCOLATEY` - Chocolatey
              * `NPM` - npm
              * `NUGET` - NuGet
              * `VAGRANT` - Vagrant
              * `COMPOSER` - Composer
              * `ALPINE` - Alpine
              * `HELM` - Helm
              * `CONAN` - Conan
              * `CARGO` - Cargo
              * `LUAROCKS` - LuaRocks
              * `CRAN` - CRAN
              * `GO` - Go
              * `DART` - Dart
              * `COCOAPODS` - CocoaPods
              * `TERRAFORM` - Terraform
              * `P2` - P2
              * `CONDA` - Conda
              * `HEX` - Hex
              * `SWIFT` - Swift
              * `HUGGINGFACE` - HuggingFace
              * `GENERIC` - Generic
              * `VSX` - VSX
              * `MCP` - MCP
              * `NIX` - Nix
              * `SKILLS` - AI Skills
              * `DEFAULT` - Default
        description: Type of package formats by which to filter logs (e.g. Nuget,
          Cargo, Raw). Multiple formats can be provided e.g. `package_format=Nuget&package_format=Cargo`.
      - in: query
        name: package_name
        schema:
          type: string
          minLength: 1
        description: Filter by package name.
      - in: query
        name: package_slug_perm
        schema:
          type: string
          minLength: 1
        description: Filter by package identifier (`slug_perm`).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: policy_slug_perm
        schema:
          type: string
          minLength: 1
        description: Filter by policy identifier (`slug_perm`).
      - in: query
        name: repository_slug_perm
        schema:
          type: string
          minLength: 1
        description: Filter by repository identifier (`slug_perm`).
      - in: query
        name: sort
        schema:
          type: string
          default: -id
        description: 'A comma-separated string of fields to sort by. Legal fields
          are: `id`. Descending order can be expressed by prepending `-` to a field
          name.'
        examples:
          ReverseChronologicalOrder(theDefault):
            value: -id
            summary: reverse chronological order (the default)
          ChronologicalOrder:
            value: id
            summary: chronological order
      - in: path
        name: workspace
        schema:
          type: string
          pattern: ^[-_\w]+$
        required: true
      tags:
      - workspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyDecisionLogV1SummaryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                InvalidCreatedAfter:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      created_after:
                      - value outside of legal range.
                  summary: Invalid created_after
                InvalidCreatedBefore:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      created_before:
                      - value outside of legal range.
                  summary: Invalid created_before
          description: Invalid query parameters.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
          description: Authentication credentials were not provided.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
          description: Insufficient permissions.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                NotFound:
                  value:
                    detail: The request is for a resource/endpoint that cannot be
                      found.
                  summary: Not Found
          description: Workspace not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                CreatedBeforePredatesCreatedAfter:
                  value:
                    code: invalid
                    detail: Invalid input.
                    fields:
                      non_field_errors:
                      - created_before is earlier than created_after.
                  summary: created_before predates created_after
          description: Invalid date/time range
  /workspaces/{workspace}/policies/decision-logs-v1/{decision_log_id}/:
    get:
      operationId: workspaces_policies_decision_logs_v1_retrieve
      description: Retrieve the full decision log JSON from S3.
      parameters:
      - in: path
        name: decision_log_id
        schema:
          type: string
          pattern: ^[0-9A-Z]{26}$
        required: true
      - in: query
        name: fields
        schema:
          type: string
        description: Comma-separated fields to include in the response (e.g. `id,correlation_id,policy_output`).
      - in: path
        name: workspace
        schema:
          type: string
          pattern: ^[-_\w]+$
        required: true
      tags:
      - workspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecisionLog'
          description: ''
  /workspaces/{workspace}/policies/validate/:
    post:
      operationId: workspaces_policies_validate
      description: |-
        Check that a Rego policy compiles, without creating or updating anything. Use this to catch syntax and type errors while authoring a policy, before submitting it to the create or update endpoints, which apply the same check.

        Returns `is_valid`, plus a `findings` list describing each problem with a code, a message and, where known, the line it occurs on. A policy is valid when `findings` contains nothing of severity `error`. The submitted Rego is not stored.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        description: The `name` of the Workspace.
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidateResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /workspaces/{workspace}/repos/{repo}/vulnerabilities/packages/:
    get:
      operationId: workspaces_vulnerabilities_repo_packages_list
      description: OSV advisory data for a specific repo.
      parameters:
      - in: query
        name: is_malware
        schema:
          type: boolean
          nullable: true
        description: Filter by malware classification (MAL- prefix or CWE-506). When
          true, only malware entries are returned; when false, malware entries are
          excluded.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: repo
        schema:
          type: string
          pattern: ^[-_\w]+$
        required: true
      - in: query
        name: threat_level
        schema:
          enum:
          - critical
          - high
          - low
          - malware
          - medium
          - unknown
          type: string
          minLength: 1
        description: |-
          Filter by the severity bucket. Accepted values: critical, high, medium, low, unknown, malware.

          * `critical` - critical
          * `high` - high
          * `low` - low
          * `malware` - malware
          * `medium` - medium
          * `unknown` - unknown
      - in: query
        name: vulnerability_id
        schema:
          type: string
          minLength: 1
        description: Filter by OSV vulnerability identifier (e.g., CVE-2024-1234 or
          GHSA-xxxx). Matching is exact and case-sensitive, and also checks the aliases
          and upstream identifiers of each advisory.
      - in: path
        name: workspace
        schema:
          type: string
          pattern: ^[-_.\w]+$
        required: true
      tags:
      - workspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebPackageVulnerabilitySummaryList'
          description: ''
