        effect:
          type: string
          readOnly: true
        package_state:
          $ref: '#/components/schemas/PackageStateEnum'
      required:
      - created_at
      - effect
      - package_state
      - slug_perm
      - updated_at
    SetPackageStatePolicyActionTyped:
      allOf:
      - type: object
        properties:
          action_type:
            type: string
        required:
        - action_type
      - $ref: '#/components/schemas/SetPackageStatePolicyAction'
    SeverityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `LOW` - LOW
        * `MEDIUM` - MEDIUM
        * `HIGH` - HIGH
        * `CRITICAL` - CRITICAL
    SourceKindEnum:
      enum:
      - UNKNOWN
      - SYSTEM
      - UPSTREAM
      - CUSTOM
      - THIRD_PARTY
      type: string
      description: |-
        * `UNKNOWN` - Unknown
        * `SYSTEM` - System
        * `UPSTREAM` - Upstream
        * `CUSTOM` - Custom
        * `THIRD_PARTY` - Third Party
    StatusEnum:
      enum:
      - UNSAFE
      - UNKNOWN
      - QUEUED
      - SAFE
      type: string
      description: |-
        * `UNSAFE` - Unsafe
        * `UNKNOWN` - Unknown
        * `QUEUED` - Queued
        * `SAFE` - Safe
    SubtypeEnum:
      enum:
      - skill
      - plugin
      type: string
    UserTypeEnum:
      enum:
      - USER
      - SERVICE
      type: string
      description: |-
        * `USER` - User
        * `SERVICE` - Service
    WebOSVAffected:
      type: object
      description: |-
        Extended OSV Affected serializer for frontend consumption.

        Uses WebOSVSeveritySerializer to include parsed CVSS components.
      properties:
        database_specific:
          nullable: true
          description: a JSON object holding additional information about the vulnerability
            as defined by the database from which the record was obtained. The meaning
            of the values within the object is entirely defined by the database. In
            general, the canonical database for a particular ecosystem should record
            its information in ecosystem_specific, allowing other aggregator databases
            to put their own summaries in database_specific. For example, databases
            that add additional information such as computed CVSS scores for ecosystems
            that do not provide them could add that information here. Note that this
            is a single field with key “database_specific”, which itself contains
            a JSON object with unspecified fields.
        ecosystem_specific:
          nullable: true
          description: A JSON object holding additional information about the vulnerability
            as defined by the ecosystem for which the record applies. The meaning
            of the values within the object is entirely defined by the ecosystem.
            For example, the Go ecosystem includes here information about the affected
            functions and which modules the packages were found in, along with severity
            in the Go project-specific severity scale. Note that this is a single
            field with key “ecosystem_specific”, which itself contains a JSON object
            with unspecified fields.
        package:
          allOf:
          - $ref: '#/components/schemas/PolicyOSVPackage'
          nullable: true
        ranges:
          nullable: true
          description: The affected object’s ranges field is a JSON array of objects
            describing the affected ranges of versions. In the range object, the type
            property is required. It specifies the type of version range being recorded
            and defines the interpretation of the events object’s introduced, fixed,
            and any type-specific fields. The ranges object’s events field is a JSON
            array of objects. Each object describes a single version that either introduces
            a vulnerability, fixes a vulnerability, describes the last known affected
            version, or sets an upper limit on the range being described.
        severity:
          type: array
          items:
            $ref: '#/components/schemas/WebOSVSeverity'
          nullable: true
        versions:
          type: array
          items:
            type: string
            description: A JSON array of strings. Each string is a single affected
              version in whatever version syntax is used by the given package ecosystem.
              When there is no well-defined packaging ecosystem specified (for example,
              general C/C++ libraries), GIT commit ranges are typically the best way
              to define vulnerable version ranges. In this case, versions specified
              in this array cannot be relied upon to conform to any particular syntax
              (e.g. they could be the upstream Git version tags derived from these
              GIT commit ranges, which is what OSV.dev populates this field with).
              In this situation, the GIT commit ranges in affected[].ranges should
              be used to match vulnerabilities by Git commit hashes.
            maxLength: 255
          nullable: true
      required:
      - package
      - severity
    WebOSVCvss:
      type: object
      description: Parsed CVSS details extracted from a CVSS severity entry.
      properties:
        vector:
          type: string
          nullable: true
          description: The original CVSS vector string.
        base_score:
          type: number
          format: double
          nullable: true
          description: The numerical CVSS base score.
        version:
          type: string
          nullable: true
          description: The CVSS version (e.g. '2.0', '3.0', '3.1', '4.0').
        groups:
          type: array
          items: {}
          nullable: true
          description: Parsed metric groups for display.
    WebOSVSeverity:
      type: object
      description: |-
        Extended OSV Severity serializer for frontend consumption.

        Reshapes the raw OSV severity entry for display:

        - ``label`` — normalized severity label (e.g. "critical", "high")
        - ``raw_label`` — original vendor label when it differs from ``label``
          (non-CVSS types only)
        - ``cvss`` — present only for CVSS types; contains ``vector``,
          ``base_score``, and parsed metric ``groups``
        - ``type`` — severity type string (e.g. "CVSS_V3", "OTHER")

        The parent ``score`` and ``numerical_score`` fields are excluded
        because they are provided through ``label`` / ``cvss``.
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WebOSVSeverityTypeEnum'
          description: "The type of severity being described. OSV schema types (CVSS_V4,\
            \ CVSS_V3, CVSS_V2, Ubuntu) or OTHER for vendor-provided labels.\n\n*\
            \ `Ubuntu` - An \"Ubuntu\" severity type indicates that the associated\
            \ score is a lowercased string\n    representing the Ubuntu priority.\n\
            \n    If a severity has this type, the associated \"score\" will be one\
            \ of \"negligible\",\n    \"low\", \"medium\", \"high\", or \"critical\"\
            .\n\n    See https://ubuntu.com/security/cves/about#priority for more\
            \ information.\n    \n* `CVSS_V2` - A \"CVSS_V2\" severity type indicates\
            \ that the associated score is a CVSS vector\n    string using a version\
            \ of the Common Vulnerability Scoring System notation that\n    is ==\
            \ 2.0 (e.g.\"AV:L/AC:M/Au:N/C:N/I:P/A:C\").\n    \n* `CVSS_V3` - A \"\
            CVSS_V3\" severity type indicates that the associated score is a CVSS\
            \ vector string\n    using a version of the Common Vulnerability Scoring\
            \ System notation that\n    is >= 3.0 and < 4.0 (e.g.\"CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:N\"\
            ).\n    \n* `CVSS_V4` - A \"CVSS_V4\" severity type indicates that the\
            \ associated score is a CVSS vector string\n    using a version of the\
            \ Common Vulnerability Scoring System notation that\n    is >= 4.0 and\
            \ < 5.0 (e.g. \"CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N\"\
            ).\n    \n* `OTHER` - A vendor-issued severity extracted from the OSV\
            \ record."
        source:
          allOf:
          - $ref: '#/components/schemas/PolicyOSVSeveritySourceEnum'
          description: |-
            The origin of the severity score (NVD, CNA, or SELF). SELF is implied when the source is not provided.

            * `NVD` - The score was assigned by the National Vulnerability Database (NVD).
            * `CNA` - The score was assigned by a CVE Numbering Authority (CNA).
            * `SELF` - The score was assigned by the record's own database.
        cvss:
          allOf:
          - $ref: '#/components/schemas/WebOSVCvss'
          nullable: true
          readOnly: true
          description: CVSS details including vector, base_score, and parsed metric
            groups. Only populated for CVSS severity types.
        label:
          type: string
          description: Normalized severity label derived from the CVSS vector or vendor-provided
            label (e.g. 'critical', 'high', 'medium', 'low').
          readOnly: true
        raw_label:
          type: string
          nullable: true
          description: 'The original severity label as provided in the OSV data, included
            only when it differs from the normalized label. '
          readOnly: true
      required:
      - cvss
      - label
      - raw_label
      - type
    WebOSVSeverityCounts:
      type: object
      description: Aggregate counts of OSV vulnerabilities by severity.
      properties:
        total:
          type: integer
          readOnly: true
        malware:
          type: integer
          readOnly: true
        critical:
          type: integer
          readOnly: true
        high:
          type: integer
          readOnly: true
        medium:
          type: integer
          readOnly: true
        low:
          type: integer
          readOnly: true
        unknown:
          type: integer
          readOnly: true
      required:
      - critical
      - high
      - low
      - malware
      - medium
      - total
      - unknown
    WebOSVSeverityTypeEnum:
      enum:
      - Ubuntu
      - CVSS_V2
      - CVSS_V3
      - CVSS_V4
      - OTHER
      type: string
      description: "* `Ubuntu` - An \"Ubuntu\" severity type indicates that the associated\
        \ score is a lowercased string\n    representing the Ubuntu priority.\n\n\
        \    If a severity has this type, the associated \"score\" will be one of\
        \ \"negligible\",\n    \"low\", \"medium\", \"high\", or \"critical\".\n\n\
        \    See https://ubuntu.com/security/cves/about#priority for more information.\n\
        \    \n* `CVSS_V2` - A \"CVSS_V2\" severity type indicates that the associated\
        \ score is a CVSS vector\n    string using a version of the Common Vulnerability\
        \ Scoring System notation that\n    is == 2.0 (e.g.\"AV:L/AC:M/Au:N/C:N/I:P/A:C\"\
        ).\n    \n* `CVSS_V3` - A \"CVSS_V3\" severity type indicates that the associated\
        \ score is a CVSS vector string\n    using a version of the Common Vulnerability\
        \ Scoring System notation that\n    is >= 3.0 and < 4.0 (e.g.\"CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:N\"\
        ).\n    \n* `CVSS_V4` - A \"CVSS_V4\" severity type indicates that the associated\
        \ score is a CVSS vector string\n    using a version of the Common Vulnerability\
        \ Scoring System notation that\n    is >= 4.0 and < 5.0 (e.g. \"CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N\"\
        ).\n    \n* `OTHER` - A vendor-issued severity extracted from the OSV record."
    WebOSVVulnerability:
      type: object
      description: |-
        Extended OSV Vulnerability serializer for frontend consumption.

        Extends PolicyOSVVulnerabilitySerializer with additional fields or
        formatting without leaking these changes into EPM.
      properties:
        affected:
          type: array
          items:
            $ref: '#/components/schemas/WebOSVAffected'
          nullable: true
        aliases:
          type: array
          items:
            type: string
            maxLength: 128
          nullable: true
          description: A list of IDs of the same vulnerability in other databases.
            This allows one database to claim that its own entry describes the same
            vulnerability as one or more entries in other databases. Note that the
            vulnerability IDs referenced here may or may not exist in the overall
            data set. Aliases should be considered symmetric (if A is an alias of
            B, then B is an alias of A) and transitive (If A aliases B and B aliases
            C, then A aliases C).
        credits:
          nullable: true
          description: A JSON array providing a way to give credit for the discovery,
            confirmation, patch, or other events in the life cycle of a vulnerability.
            Each of the objects in the credits array must contain at minimum a name
            field specifying the name of the individual or entity being credited,
            using whatever notation they prefer. It can also optionally include a
            contact JSON array.
        database_specific:
          nullable: true
          description: Additional information about the vulnerability as defined by
            the database from which the record was obtained. This is a JSON object
            with unspecified fields, and the meaning of the values within the object
            is entirely defined by the database.
        details:
          type: string
          nullable: true
          description: Additional English textual details about the vulnerability.
            This field contains CommonMark markdown (a subset of GitHub-Flavored Markdown).
        id:
          type: string
        modified:
          type: string
          format: date-time
          description: The time the osv.dev vulnerability entry was last modified.
        published:
          type: string
          format: date-time
          nullable: true
          description: The time the entry should be considered to have been published
        references:
          nullable: true
          description: a list of JSON objects describing references. Each object has
            a string field type specifying the type of reference, and a string field
            url. The url is the fully-qualified URL (including the scheme, typically
            “https://”) linking to additional information, advisories, issue tracker
            entries, and so on about the vulnerability itself. The type specifies
            what kind of reference the URL is.
        related:
          type: array
          items:
            type: string
            maxLength: 128
          nullable: true
          description: A list of closely related vulnerabilities, such as a similar
            but completely different vulnerability or cases that do not satisfy the
            strict definition of aliases or upstream. Related vulnerabilities are
            symmetric but not transitive.
        schema_version:
          type: string
          nullable: true
          description: The version of the OSV schema a particular vulnerability was
            exported with. The value should be a string matching the OSV Schema version,
            which follows the SemVer 2.0.0 format, with no leading “v” prefix. If
            no value is specified, it should be assumed to be 1.0.0, matching version
            1.0 of the OSV Schema.
          maxLength: 128
        severity:
          type: array
          items:
            $ref: '#/components/schemas/WebOSVSeverity'
          nullable: true
        summary:
          type: string
          nullable: true
          description: A one-line, English textual summary of the vulnerability. It
            is recommended that this field be kept short, on the order of no more
            than 120 characters.
        upstream:
          type: array
          items:
            type: string
            maxLength: 128
          nullable: true
          description: A list of IDs of upstream vulnerabilities that are referred
            to by the vulnerability entry. For example, a downstream package ecosystem
            (such as a Linux distribution) may issue its own advisories that include
            (possibly multiple) upstream vulnerabilities. Upstream should be considered
            transitive but not symmetric.
        withdrawn:
          type: string
          format: date-time
          nullable: true
          description: The time the entry should be considered to have been withdrawn.
            If the field is missing, then the entry has not been withdrawn. Any rationale
            for why the vulnerability has been withdrawn should go into the summary
            text.
        vulnerability_id:
          type: string
          description: The vulnerability identifier (alias for 'id' field).
          readOnly: true
        cve_id:
          type: string
          nullable: true
          description: The CVE identifier for the vulnerability, if it exists.
          readOnly: true
        title:
          type: string
          nullable: true
          description: The vulnerability title (alias for 'summary' field).
          readOnly: true
        source:
          type: string
          nullable: true
          description: The source database of the vulnerability, extracted from the
            vulnerability ID prefix (e.g., 'GHSA', 'CVE', 'PYSEC', 'MAL').
          readOnly: true
        source_name:
          type: string
          nullable: true
          description: The full name of the source database (e.g., 'GitHub Security
            Advisory Database', 'National Vulnerability Database').
          readOnly: true
        purl:
          type: string
          nullable: true
          description: The Package URL (purl) of the first affected package, if available.
          readOnly: true
        package_name:
          type: string
          nullable: true
          description: The name of the first affected package, if available.
          readOnly: true
        best_severity:
          type: object
          additionalProperties: {}
          nullable: true
          description: The highest-version severity score available, preferring affected
            object > severity object, then preferring CVSS V4 > V3.1 > V3 > V2 > vendor
            severity.
          readOnly: true
        highest_severity:
          type: object
          additionalProperties: {}
          nullable: true
          description: The severity with the highest numerical score or label across
            all affected entries and the vulnerability.
          readOnly: true
        is_malware:
          type: boolean
          description: Whether this vulnerability is classified as malware (MAL- prefix
            or CWE-506).
          readOnly: true
        epss:
          allOf:
          - $ref: '#/components/schemas/PolicyEPSSScore'
          nullable: true
          readOnly: true
          description: The EPSS score of the vulnerability's CVE (cve_id), if it has
            one.
      required:
      - affected
      - best_severity
      - cve_id
      - epss
      - highest_severity
      - id
      - is_malware
      - modified
      - package_name
      - purl
      - severity
      - source
      - source_name
      - title
      - vulnerability_id
    WebPackageVulnerabilitySummary:
      type: object
      properties:
        slug_perm:
          type: string
          readOnly: true
          description: The unique identifier for the package.
        repository:
          type: string
          readOnly: true
          description: The repository this package belongs to.
        name:
          type: string
          readOnly: true
          description: The package name.
        version:
          type: string
          readOnly: true
          description: The package version.
        downloads:
          type: integer
          readOnly: true
        format:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
          description: The synchronisation status of the package.
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
          description: When the package was uploaded.
        vulnerability_counts:
          type: object
          additionalProperties:
            type: integer
          description: Breakdown of vulnerabilities by severity level.
          readOnly: true
      required:
      - downloads
      - format
      - name
      - repository
      - slug_perm
      - status
      - uploaded_at
      - version
      - vulnerability_counts
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: X-Api-Key
    basic:
      type: http
      scheme: basic
servers:
- url: https://api.cloudsmith.io/v2/
externalDocs:
  url: https://help.cloudsmith.io/reference/introduction
  description: Cloudsmith API Reference
security:
- apikey: []
- basic: []
