        - type
      - $ref: '#/components/schemas/PolicyHuggingfaceModelCard'
    PolicyHuggingfacePackage:
      type: object
      description: |-
        The details of a Huggingface package for policy purposes.

        This extends the common package fields with Huggingface-specific fields including
        the model/dataset-card data.
      properties:
        architectures:
          type: array
          items:
            $ref: '#/components/schemas/PolicyArchitecture'
        card:
          allOf:
          - $ref: '#/components/schemas/PolicyHuggingfaceCard'
          nullable: true
        description:
          type: string
          nullable: true
          description: A textual description of this package.
          maxLength: 12288
        files:
          type: array
          items:
            $ref: '#/components/schemas/PolicyHuggingfaceFileReference'
        format:
          type: string
        indexed:
          type: boolean
        is_local:
          type: boolean
          description: Whether the package is cached in the repository or proxied
            from an upstream
          readOnly: true
        last_downloaded_at:
          type: string
          format: date-time
          description: The last time the package was downloaded.
        license:
          $ref: '#/components/schemas/PolicyPackageLicense'
        name:
          type: string
          nullable: true
          description: The name of this package.
          maxLength: 200
        num_files:
          type: integer
        package_type:
          $ref: '#/components/schemas/PackageTypeEnum'
        security_scan_completed_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning was completed.
        security_scan_started_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning was started.
        security_scan_status:
          $ref: '#/components/schemas/SecurityScanStatusEnum'
        security_scan_status_updated_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning status was updated.
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: The calculated size of the package.
        slug:
          type: string
          readOnly: true
          description: The public unique identifier for the package.
          pattern: ^[-a-zA-Z0-9_]+$
        slug_perm:
          type: string
          maxLength: 16
          pattern: ^[-a-zA-Z0-9_]+$
        summary:
          type: string
          nullable: true
          description: A one-liner synopsis of this package.
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPackageTag'
        uploaded_at:
          type: string
          format: date-time
          description: The date this package was uploaded.
        uploader:
          $ref: '#/components/schemas/PolicyUploader'
        upstream_metadata:
          allOf:
          - $ref: '#/components/schemas/PolicyUpstreamMetadata'
          nullable: true
          description: Additional information in the form of arbitrary metadata that
            may be copied or added from the upstream source during upstream caching.
            For example the published at timestamp, or attestations etc.
        version:
          type: string
          nullable: true
          description: The raw version for this package.
          maxLength: 255
      required:
      - architectures
      - files
      - format
      - is_local
      - last_downloaded_at
      - license
      - num_files
      - package_type
      - security_scan_status
      - slug
      - tags
    PolicyHuggingfacePackageTyped:
      allOf:
      - type: object
        properties:
          format:
            type: string
        required:
        - format
      - $ref: '#/components/schemas/PolicyHuggingfacePackage'
    PolicyHuggingfaceSecurity:
      type: object
      properties:
        availability:
          allOf:
          - $ref: '#/components/schemas/AvailabilityEnum'
          description: |-
            Whether security data is available for this Huggingface package.

            * `UNAVAILABLE` - Unavailable
            * `PARTIAL` - Partially complete
            * `COMPLETE` - Complete
        scan_summary:
          allOf:
          - $ref: '#/components/schemas/ScanSummaryEnum'
          description: |-
            If data is available, the overall summary of the scan results. Result precedence from highest to lowest is: UNSAFE > UNKNOWN > QUEUED > SAFE.

            * `UNSAFE` - Unsafe
            * `UNKNOWN` - Unknown
            * `QUEUED` - Queued
            * `SAFE` - Safe
        scan_details:
          type: array
          items:
            $ref: '#/components/schemas/PolicyHuggingfaceHubScans'
          description: The scan details for any file that is NOT reported as SAFE
            will be included in this list.
        source:
          $ref: '#/components/schemas/PolicyHuggingfaceSecuritySourceEnum'
      required:
      - availability
    PolicyHuggingfaceSecuritySourceEnum:
      enum:
