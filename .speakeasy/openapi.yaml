          description: If true, the tag is immutable and cannot be (normally) removed.
        name:
          type: string
          description: The name for the tag.
          maxLength: 255
        source:
          $ref: '#/components/schemas/PackageTagSourceTypeEnum'
        tag_type:
          $ref: '#/components/schemas/PackageTagTypeEnum'
      required:
      - name
      - source
      - tag_type
    PolicyPackageTyped:
      allOf:
      - type: object
        properties:
          format:
            type: string
        required:
        - format
      - $ref: '#/components/schemas/PolicyPackage'
    PolicyPolymorphicPackage:
      oneOf:
      - $ref: '#/components/schemas/PolicyPackageTyped'
      - $ref: '#/components/schemas/PolicyHuggingfacePackageTyped'
      - $ref: '#/components/schemas/PolicyMavenPackageTyped'
      - $ref: '#/components/schemas/PolicySkillsPackageTyped'
      discriminator:
        propertyName: format
        mapping:
          Package: '#/components/schemas/PolicyPackageTyped'
          HuggingfacePackage: '#/components/schemas/PolicyHuggingfacePackageTyped'
          MavenPackage: '#/components/schemas/PolicyMavenPackageTyped'
          SkillsPackage: '#/components/schemas/PolicySkillsPackageTyped'
    PolicyRepository:
      type: object
      description: The details of the package repository for policy purposes.
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
          description: A description of the repository's purpose/contents.
          maxLength: 1000
        ecdsa_keys:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRepositoryEcdsaKey'
        gpg_keys:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRepositoryGpgKey'
        name:
          type: string
          description: A descriptive name for the repository.
          pattern: ^\w[\w \-'\.\/()]+$
          maxLength: 50
        open_source_license:
          type: string
          nullable: true
        repository_type:
          $ref: '#/components/schemas/RepositoryTypeEnum'
        slug:
          type: string
          description: The slug identifies the repository in URIs.
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        slug_perm:
          type: string
          description: The slug_perm immutably identifies the repository. It will
            never change once a repository has been created.
          maxLength: 16
          pattern: ^[-a-zA-Z0-9_]+$
        storage_region:
          type: string
          readOnly: true
      required:
      - ecdsa_keys
      - gpg_keys
      - name
      - open_source_license
      - repository_type
      - storage_region
    PolicyRepositoryEcdsaKey:
      type: object
      description: An ECDSA key used to sign repository contents.
      properties:
        active:
          type: boolean
          description: If selected this is the active key for this repository.
        created_at:
          type: string
          format: date-time
        default:
          type: boolean
          description: If selected this is the default key for this repository.
        fingerprint_short:
          type: string
          readOnly: true
        fingerprint:
          type: string
          description: The long identifier used by ECDSA for this key.
          maxLength: 32
        public_key:
          type: string
          description: The public key given to repository users.
        ssh_fingerprint:
          type: string
          nullable: true
          description: The SSH fingerprint used by ECDSA for this key.
          maxLength: 128
      required:
      - fingerprint
      - fingerprint_short
      - public_key
    PolicyRepositoryGpgKey:
      type: object
      description: A GPG key used to sign repository contents.
      properties:
        active:
          type: boolean
          description: If selected this is the active key for this repository.
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        default:
          type: boolean
          description: If selected this is the default key for this repository.
        fingerprint_short:
          type: string
          readOnly: true
        fingerprint:
          type: string
          description: The long identifier used by GPG for this key.
          maxLength: 40
        public_key:
          type: string
          description: The public key given to repository users.
      required:
      - comment
      - fingerprint
      - fingerprint_short
      - public_key
    PolicySkillsPackage:
      type: object
      description: |-
        The details of an AI Skills package for policy purposes.

        Adds what a Claude Code plugin bundles; `plugin` is null for a single skill,
        and `subtype` is "plugin" or "skill".
      properties:
        architectures:
          type: array
          items:
            $ref: '#/components/schemas/PolicyArchitecture'
        checksum_md5:
          type: string
          readOnly: true
        checksum_sha1:
          type: string
          readOnly: true
        checksum_sha256:
          type: string
          readOnly: true
        checksum_sha512:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
          description: A textual description of this package.
          maxLength: 12288
        distro:
          $ref: '#/components/schemas/PolicyDistribution'
        distro_version:
          $ref: '#/components/schemas/PolicyDistributionVersion'
        epoch:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: The epoch of the package version (if any).
        extension:
          type: string
          readOnly: true
        filename:
          type: string
          maxLength: 255
        files:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPackageFile'
        format:
          type: string
        indexed:
          type: boolean
        is_local:
          type: boolean
          description: Whether the package is cached in the repository or proxied
            from an upstream
          readOnly: true
        last_downloaded_at:
          type: string
          format: date-time
          description: The last time the package was downloaded.
        license:
          $ref: '#/components/schemas/PolicyPackageLicense'
        name:
          type: string
          nullable: true
          description: The name of this package.
          maxLength: 200
        num_files:
          type: integer
          maximum: 2147483647
          minimum: 0
        package_type:
          $ref: '#/components/schemas/PackageTypeEnum'
        plugin:
          allOf:
          - $ref: '#/components/schemas/PolicySkillsPlugin'
          readOnly: true
          nullable: true
        release:
          type: string
          nullable: true
          description: The release of the package version (if any).
          maxLength: 96
        security_scan_completed_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning was completed.
        security_scan_started_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning was started.
        security_scan_status:
          $ref: '#/components/schemas/SecurityScanStatusEnum'
        security_scan_status_updated_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the security scanning status was updated.
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: The calculated size of the package.
        slug:
          type: string
          readOnly: true
          description: The public unique identifier for the package.
          pattern: ^[-a-zA-Z0-9_]+$
        slug_perm:
          type: string
          maxLength: 16
          pattern: ^[-a-zA-Z0-9_]+$
        subtype:
          allOf:
          - $ref: '#/components/schemas/SubtypeEnum'
          description: Distinguish skills from plugins in shared/cross-format package
            listings and policies.
          readOnly: true
        summary:
          type: string
          nullable: true
          description: A one-liner synopsis of this package.
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPackageTag'
        uploaded_at:
          type: string
          format: date-time
          description: The date this package was uploaded.
        uploader:
          $ref: '#/components/schemas/PolicyUploader'
        upstream_metadata:
          allOf:
          - $ref: '#/components/schemas/PolicyUpstreamMetadata'
          nullable: true
          description: Additional information in the form of arbitrary metadata that
            may be copied or added from the upstream source during upstream caching.
            For example the published at timestamp, or attestations etc.
        version:
          type: string
          nullable: true
          description: The raw version for this package.
          maxLength: 255
      required:
      - architectures
      - checksum_md5
      - checksum_sha1
      - checksum_sha256
      - checksum_sha512
      - distro
      - distro_version
      - extension
      - filename
      - files
      - format
      - is_local
      - last_downloaded_at
      - license
      - package_type
      - plugin
      - security_scan_status
      - slug
      - subtype
      - tags
    PolicySkillsPackageTyped:
      allOf:
      - type: object
        properties:
          format:
            type: string
        required:
        - format
      - $ref: '#/components/schemas/PolicySkillsPackage'
    PolicySkillsPlugin:
      type: object
      description: |-
        What a Claude Code plugin bundles, for policy purposes.

        `hooks`, `mcp_servers`, `lsp_servers`, `monitors` and `executables` run code
        on the user's machine once the plugin is enabled. They are detected on a
        best-effort basis, so a policy that must not allow code should match
        `subtype == "plugin"` rather than rely on them being false.
      properties:
        skills:
          type: array
          items:
            type: string
        agents:
          type: array
          items:
            type: string
        commands:
          type: array
          items:
            type: string
        output_styles:
          type: array
          items:
            type: string
        workflows:
          type: array
          items:
            type: string
        hooks:
          type: boolean
        mcp_servers:
          type: boolean
        lsp_servers:
          type: boolean
        monitors:
          type: boolean
        executables:
          type: boolean
      required:
      - agents
      - commands
      - executables
      - hooks
      - lsp_servers
      - mcp_servers
      - monitors
      - output_styles
      - skills
      - workflows
    PolicyUploader:
      type: object
      description: The package uploader for policy puposes.
      properties:
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          description: Your email address that we use to contact you. This is only
            visible to you.
          maxLength: 254
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
        slug_perm:
          type: string
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/PolicyUploaderTeam'
          readOnly: true
          description: The teams the uploader belongs to in the package's workspace.
            Only present when the policy reads it, and empty when the input is serialized
            without a workspace.
      required:
      - first_name
      - last_name
      - slug
      - slug_perm
      - teams
